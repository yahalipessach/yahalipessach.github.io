let alpha=1;
function forces(){
 for(let i=0;i<nodes.length;i++){const a=nodes[i];
  for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
   let dx=b.x-a.x,dy=b.y-a.y;let d2=dx*dx+dy*dy||1;
   if(d2<130000){const d=Math.sqrt(d2),f=2100/d2;dx/=d;dy/=d;
    a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;}}}
 edges.forEach(e=>{let dx=e.t.x-e.s.x,dy=e.t.y-e.s.y;
  const d=Math.sqrt(dx*dx+dy*dy)||1,ideal=e.s.cr+e.t.cr+95;
  if(d>ideal){const f=(d-ideal)/d*.004*e.w;
   e.s.vx+=dx*f;e.s.vy+=dy*f;e.t.vx-=dx*f;e.t.vy-=dy*f;}});
 nodes.forEach(n=>{n.vx+=(n.ax-n.x)*.02;n.vy+=(n.ay-n.y)*.02;});
}
function collide(){
 for(let pass=0;pass<4;pass++)
 for(let i=0;i<nodes.length;i++){const a=nodes[i];
  for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
   let dx=b.x-a.x,dy=b.y-a.y;const min=(a.cr+b.cr)*.86;
   let d2=dx*dx+dy*dy;
   if(d2<min*min){let d=Math.sqrt(d2)||.01;const push=(min-d)/d*.5;
    dx*=push;dy*=push;
    if(!a.fixed){a.x-=dx;a.y-=dy;} if(!b.fixed){b.x+=dx;b.y+=dy;}}}}
}
function step(){forces();
 nodes.forEach(n=>{if(n.fixed){n.vx=0;n.vy=0;return;}
  n.vx*=.75;n.vy*=.75;n.x+=n.vx*alpha;n.y+=n.vy*alpha;});
 collide();}
function render(){
 edges.forEach((e,i)=>{const el=edgeEls[i];
  el.setAttribute("x1",e.s.x);el.setAttribute("y1",e.s.y);
  el.setAttribute("x2",e.t.x);el.setAttribute("y2",e.t.y);});
 nodes.forEach((n,i)=>nodeEls[i].setAttribute("transform","translate("+n.x+","+n.y+")"));}
for(let i=0;i<300;i++){step();alpha=Math.max(alpha*.995,.15);}
alpha=.04;

let selected=null;const hidden=new Set();
let tf={x:0,y:0,k:1};
function applyTf(){view.setAttribute("transform","translate("+tf.x+","+tf.y+") scale("+tf.k+")");
 view.style.setProperty("--hitr",(13/tf.k)+"px");scheduleLabels();}
/* labels: constant on-screen size, decluttered */
let labTimer=null;
function scheduleLabels(){if(labTimer)clearTimeout(labTimer);labTimer=setTimeout(labelLayout,60);}
function labelLayout(){
 const FS=11;                      /* constant on-screen font px */
 const fs=FS/tf.k;
 gZ.querySelectorAll("text").forEach(t=>t.style.fontSize=(15/tf.k)+"px");
 const kept=[]; let shown=0;
 const pri=new Set();
 if(selected){pri.add(selected);const nb=neighbors(selected);nb.inn.forEach(i=>pri.add(i));nb.out.forEach(i=>pri.add(i));}
 const order=[...nodes].sort((a,b)=>((pri.has(b.id)?1:0)-(pri.has(a.id)?1:0))||(b.r-a.r));
 order.forEach(n=>{
  const g=nodeEls[nodes.indexOf(n)];
  const el=g.querySelector("text");
  el.style.fontSize=fs+"px";
  const k=tf.k;
  const rEff=Math.max(n.r,5.5/k);          /* minimum visible dot size */
  g.querySelector("circle").setAttribute("r",rEff);
  const sx=n.x*k+tf.x, sy=n.y*k+tf.y+52, rs=rEff*k;
  const w=n.short.length*FS*.53+4, h=FS+2;
  const cand=[
   {a:"middle",x:0, dy:rEff+13/k, box:{x0:sx-w/2,x1:sx+w/2,y0:sy+rs+2,y1:sy+rs+2+h}},
   {a:"middle",x:0, dy:-(rEff+5/k), box:{x0:sx-w/2,x1:sx+w/2,y0:sy-rs-2-h,y1:sy-rs-2}},
   {a:"start", x:rEff+6/k, dy:fs*.35, box:{x0:sx+rs+4,x1:sx+rs+4+w,y0:sy-h/2,y1:sy+h/2}},
   {a:"end",   x:-(rEff+6/k), dy:fs*.35, box:{x0:sx-rs-4-w,x1:sx-rs-4,y0:sy-h/2,y1:sy+h/2}}
  ];
  let pick=null;
  for(const c of cand){
   if(!kept.some(b=>!(c.box.x1<b.x0||c.box.x0>b.x1||c.box.y1<b.y0||c.box.y0>b.y1))){pick=c;break;}}
  if(!pick&&pri.has(n.id))pick=cand[0];
  if(pick){
   el.setAttribute("text-anchor",pick.a);
   el.setAttribute("x",pick.x);
   el.setAttribute("dy",pick.dy);
   el.classList.remove("lhid");
   kept.push(pick.box);shown++;}
  else el.classList.add("lhid");});
 labelLayout.shown=shown;}

function fit(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 nodes.forEach(n=>{x0=Math.min(x0,n.x-n.cr);y0=Math.min(y0,n.y-n.cr);
  x1=Math.max(x1,n.x+n.cr);y1=Math.max(y1,n.y+n.cr);});
 const L=(W()>1080?300:0);
 const k=Math.min((W()-L)/(x1-x0),(H()-60)/(y1-y0))*.87;
 tf.k=k;tf.x=L+(W()-L)/2-(x0+x1)/2*k;tf.y=(H()+52)/2-(y0+y1)/2*k;applyTf();}
function phoneView(){
 let sx=0,sy=0,x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 nodes.forEach(n=>{sx+=n.x;sy+=n.y;
  x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);});
 const cx=sx/nodes.length,cy=sy/nodes.length;
 const k=Math.max(.07,Math.min(.5,Math.min(1200/(x1-x0||1),840/(y1-y0||1))*.87));
 tf.k=k;tf.x=W()/2-cx*k;tf.y=(H()+52)/2-cy*k;applyTf();}
function initialView(){ if(W()>760) fit(); else phoneView(); }
initialView();render();labelLayout();
let fr=0;
(function loop(){step();render();if(++fr%45===0)labelLayout();requestAnimationFrame(loop);})();

 tf.x=mx-(mx-tf.x)*(k/tf.k);tf.y=my-(my-tf.y)*(k/tf.k);tf.k=k;applyTf();},{passive:false});

function neighbors(id){const inn=new Set(),out=new Set();
 edges.forEach(e=>{if(e.s.id===id)out.add(e.t.id);if(e.t.id===id)inn.add(e.s.id);});
 return{inn,out};}
function refresh(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 let nb=null;if(selected)nb=neighbors(selected);
 nodes.forEach((n,i)=>{const el=nodeEls[i];
  el.classList.toggle("off",hidden.has(n.cat));
  let dim=false,hit=false;
  if(selected)dim=!(n.id===selected||nb.inn.has(n.id)||nb.out.has(n.id));
  if(q){if(n.n.toLowerCase().includes(q)||n.d.toLowerCase().includes(q)){hit=true;dim=false;}else dim=true;}
  el.classList.toggle("dim",dim&&!hidden.has(n.cat));
  el.classList.toggle("hit",hit);el.classList.toggle("sel",n.id===selected);});
 edges.forEach((e,i)=>{const el=edgeEls[i];
  el.classList.toggle("off",hidden.has(e.s.cat)||hidden.has(e.t.cat));
  let dim=false,stroke="#000";
  if(selected){if(e.s.id===selected)stroke="#dc2626";else if(e.t.id===selected)stroke="#2563eb";else dim=true;}
  if(q&&!dim){if(!(e.s.n.toLowerCase().includes(q)||e.t.n.toLowerCase().includes(q)))dim=true;}
  el.setAttribute("stroke",stroke);el.classList.toggle("dim",dim);});}

svg.addEventListener("dblclick",ev=>{const id=pressedNode(ev);if(!id)return;

 const sx=tf.x,sy=tf.y,sk=tf.k,t0=performance.now();
 (function anim(t){const p=Math.min(1,(t-t0)/280),e2=p*(2-p);
  tf.x=sx+(tx-sx)*e2;tf.y=sy+(ty-sy)*e2;tf.k=sk+(tk-sk)*e2;applyTf();
  if(p<1)requestAnimationFrame(anim);})(t0);});

 if(n){select(n.id);const tk=Math.max(tf.k,1.05);
  tf.k=tk;tf.x=W()/2-n.x*tk;tf.y=H()/2-n.y*tk;applyTf();}}});
document.getElementById("btnFit").addEventListener("click",fit);

/* small screens */
const legendEl=document.getElementById("legend"),btnKey=document.getElementById("btnKey");
btnKey.addEventListener("click",()=>legendEl.classList.toggle("open"));

let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(initialView,180);});
addEventListener("orientationchange",()=>setTimeout(initialView,320));
setTimeout(initialView,900);

/* pinch to zoom */
const ptrs=new Map();let pinch=null;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
svg.addEventListener("pointerdown",ev=>{ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
 if(ptrs.size===2){const[a,b]=[...ptrs.values()];
  pinch={d:dist(a,b),k:tf.k,mx:(a.x+b.x)/2,my:(a.y+b.y)/2-52,tx:tf.x,ty:tf.y};
  drag=null;panning=null;stage.classList.remove("panning");}},true);
svg.addEventListener("pointermove",ev=>{if(!ptrs.has(ev.pointerId))return;
 ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
 if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];
  const k=Math.min(5,Math.max(.1,pinch.k*dist(a,b)/(pinch.d||1)));
  tf.x=pinch.mx-(pinch.mx-pinch.tx)*(k/pinch.k);
  tf.y=pinch.my-(pinch.my-pinch.ty)*(k/pinch.k);tf.k=k;applyTf();
  ev.preventDefault();ev.stopPropagation();}},true);
function endPtr(ev){ptrs.delete(ev.pointerId);if(ptrs.size<2)pinch=null;}
svg.addEventListener("pointerup",endPtr,true);
svg.addEventListener("pointercancel",endPtr,true);

refresh();
</script>
</body>
